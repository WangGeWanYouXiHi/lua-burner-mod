# Gradle property for the Gradle daemon. You may need to increase this for large projects.
org.gradle.jvmargs=-Xmx3G

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=false

# NeoForge / Minecraft versions
minecraft_version=1.21.1
neoforge_version=21.1.240

# Mod identity
mod_id=luaburner
mod_name=Lua Blueprint Burner
mod_version=1.0.0
mod_group=com.luaburner
mod_authors=WorkBuddy
mod_description=A blueprint-desk style machine that burns local Lua files onto CC:Tweaked floppy disks.

# mod_name with escaped unicode (Gradle reads ISO-8859-1)
mod_name_escaped=Lua Blueprint Burner
