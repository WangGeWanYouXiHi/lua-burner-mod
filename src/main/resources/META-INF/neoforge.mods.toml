modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "luaburner"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.luaburner]]
modId = "neoforge"
type = "required"
versionRange = "[21.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.luaburner]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

# CC:Tweaked provides the floppy disk media API we compile against.
[[dependencies.luaburner]]
modId = "computercraft"
type = "required"
versionRange = "[1.118.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: the checklist puller machine only registers when at least one is present.
[[dependencies.luaburner]]
modId = "create"
type = "optional"
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.luaburner]]
modId = "ae2"
type = "optional"
versionRange = "[19.0.0,)"
ordering = "AFTER"
side = "BOTH"
